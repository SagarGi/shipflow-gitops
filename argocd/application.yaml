apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: shipflow-api
  namespace: argocd
  
spec:
  project: default

  source:
    repoURL: https://github.com/SagarGi/shipflow-gitops.git
    targetRevision: main
    path: helm/shipflow-api

  destination:
    server: https://kubernetes.default.svc
    namespace: shipflow

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true